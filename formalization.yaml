version: "v0.4"

project:
  name: "QuadraticFloor: quadratic floor sums and the trace of a quartic Bernoulli number"
  description: >-
    For an odd prime p and integers A, B, C, the alternating floor sum S_{A,B,C}(p) is the sum over
    0 <= n < p of (-1)^floor((A n^2 + B n + C)/p). The development proves the root-count reduction
    of S_{A,B,C}(p) to a sum of Legendre symbols over an arithmetic progression when A + B is even,
    and, for a positive odd A, an odd prime p not dividing A and an admissible pair (B odd, prime to
    A, 1 <= B^2 - 4AC < 4A), the square-class decomposition: S_{A,B,C}(p) equals (-1)^C minus the
    average over the Dirichlet characters psi modulo A of conj(psi(B))^2 times the first Bernoulli
    number, at modulus 8Ap, of the odd character eta_p chi_{-4}^{delta} psi, where eta_p is the
    Kronecker character of discriminant -8p. Consequently the sum depends only on the square class
    of B modulo A. At A = 1 and A = 3 this gives the floor sums in terms of Bernoulli numbers of
    quadratic characters (which are class numbers by Dirichlet's formula, not formalized). At A = 5
    the difference S_{5,3,0}(p) - S_{5,1,0}(p) is the real part of the first Bernoulli number of the
    quartic character Theta_p = eta_p chi_{-4} xi of conductor 40p, with xi(2) = i; this real part is
    an even integer whose residue modulo 4 is given by an explicit count. Finally the sums with
    A = 1 and fixed shifts a, b are classified: for odd a in terms of S_{1,1,0}(p) and an oriented
    sum of Legendre symbols, for even a by an explicit finite formula that is bounded and eventually
    constant in p.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

