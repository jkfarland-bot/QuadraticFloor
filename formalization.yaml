    The author chose the scope (the root count, the square-class decomposition and its corollaries,
    the coefficients 1, 3 and 5 in Bernoulli form, and the monic classification) and reviewed the
    formal statements in Challenge.lean against the paper.

fidelity:
  divergences: >-
    Floor division is integer division by the positive integer p. eta_p is defined as the Jacobi
    symbol (-8p / x) for odd x and 0 for even x, which is the Kronecker character of discriminant
    -8p; the paper's formula (2.2) is proved from it by quadratic reciprocity. Bernoulli numbers
    B_{1,f}^{(q)} = (1/q) sum_{x=1}^{q} x f(x) are defined for any function f on the natural numbers,
    and the characters theta_{p,psi} are the functions eta_p chi_{-4}^{delta} psi, with chi_{-4}^0
    taken as chi_{-4}^2, the principal character modulo 4. Lemma 3.1 is proved for arbitrary
    functions with the stated symmetries. In the cases A = 3 and A = 5 the characters are written as
    explicit functions: eta_p times the indicator of numbers prime to 3 (or 5) for eta_p induced to
    the larger modulus, eta_p chi_{-4} (x/3) for chi_{-24p}, and eta_p (x/5) for chi_{-40p}. No class
    number appears: Theorems 4.1 and 4.2 are proved in Bernoulli form, Theorem 4.4 as its two
    linear combinations (the difference is Corollary 4.5 and the sum the quadratic half), and the
    class-number versions follow from Dirichlet's formula, which is quoted. In Proposition 4.6 z_B is
    defined as whether some 0 <= j <= (p-1)/2 has p dividing B^2 + 40 j, which is equivalent to the
    paper's description through the unique solution j_B. In Theorem 7.1 the odd case is stated with
    S_{1,1,0}(p) - 1 in place of h(-8p), and eventual constancy as the existence of a bound N and a
    value c with S_{1,2t,b}(p) = c for every prime p > N.

