sources:
  - title: "Quadratic Floor Sums, Class Numbers, and the Trace of a Quartic Bernoulli Number"
    authors:
      - "Joseph S. Farland"
    type: "article"
    location: "Unpublished manuscript (revised research draft), 2026"
    relationship: "formalizes"
    note: >-
      The manuscript and this formalization have the same author; the manuscript has not yet been
      posted, and the numbering here is that of its revised draft. Formalized: Lemma 2.1, equation
      (2.2), Lemma 2.3, Lemma 3.1, Theorem 3.2, Corollaries 3.3 and 3.4, Theorems 4.1 and 4.2 and the
      two halves of Theorem 4.4 in Bernoulli form, Corollary 4.5 (the quartic split), Proposition 4.6
      and Theorem 7.1. Not formalized: the class-number identifications through Dirichlet's formula,
      Corollaries 3.5 and 3.6, Corollary 4.3, Proposition 4.7 and Corollary 4.8 (the quartic field and
      its class number), Theorem 5.1 (conductor 8 l p), and Section 6 (the collision theorem and the
      determinant certificates), which rest on large class-number computations. On novelty: the
      class-number content of the cases A = 1 and A = 3 is classical (Dirichlet-type formulas of
      Hudson and Williams and of Godin and Williams), and the coset-averaging mechanism of Theorem 3.2
      is that of Szmidt, Urbanowicz and Zagier together with character orthogonality. The author
      found neither the floor-sum form of these identities nor the quartic split in the sources
      searched (the Dirichlet-type literature above, Berndt's survey, and Chamberland and Dilcher's
      floor-sum papers); novelty is claimed only relative to that search.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
