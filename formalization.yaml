status:
  scope: >-
    Formalized: the root-count lemma for every A + B even; the reciprocity form eta_p(x) =
    kappa_p(x) (x/p); the window form; the half-period identities for functions of period 2h; the
    square-class decomposition for every positive odd A and admissible pair; the universal case
    B = 1, C = 0; dependence only on the square class of B modulo A, with every square class
    arising; the cases A = 1 and A = 3 in Bernoulli form; at A = 5 the quartic split
    Re B_{1,Theta_p} = S_{5,3,0}(p) - S_{5,1,0}(p), the quadratic half S_{5,1,0}(p) + S_{5,3,0}(p) - 2
    in Bernoulli form, and the residue of Re B_{1,Theta_p} modulo 4; and the classification of the
    monic shifts with its bound and eventual constancy. Not formalized: Dirichlet's identities
    B_{1,chi_D} = -h(D), which turn the Bernoulli forms into class-number formulas; the fibre and
    trace corollaries; the quartic field K_p and h(K_p); the conductor 8 l p theorem; and the
    non-elimination results of Section 6, which are computations with class numbers and large
    determinants.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

